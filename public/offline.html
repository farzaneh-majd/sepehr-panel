<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Sepehr Panel — Offline</title>
  <style>
    @font-face { font-family: IRANSansXV; src: url("/fonts/IRANSansXV.woff2") format("woff2"); font-display: swap; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #f4f5f7; color: #172b4d; font-family: IRANSansXV, Tahoma, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    main { width: min(420px, 100%); padding: 32px; border: 1px solid #dfe1e6; border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgba(9, 30, 66, .12); }
    img { width: 72px; height: 72px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #44546f; font-size: 15px; }
    button { border: 0; border-radius: 6px; padding: 10px 24px; background: #0c66e4; color: #fff; font: inherit; font-size: 15px; cursor: pointer; }
    button:hover { background: #0055cc; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/logo.svg" alt="Sepehr Panel">
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>پس از بررسی اتصال، دوباره تلاش کنید.</p>
    <button onclick="location.reload()">تلاش دوباره</button>
  </main>
</body>
</html>
